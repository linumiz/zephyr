CONFIG_CLOCK_CONTROL_IFX_CAT1_FIXED_CLOCK=y
CONFIG_CLOCK_CONTROL_IFX_CAT1_FIXED_FACTOR_CLOCK=n
CONFIG_CLOCK_CONTROL_IFX_CAT1_PERI_CLOCK=n
CONFIG_CLOCK_CONTROL_INFINEON_CAT1=y
CONFIG_PINCTRL_INFINEON_CAT1=y
CONFIG_PINCTRL=y
CONFIG_GPIO_INFINEON_CAT1=y
CONFIG_GPIO=y
CONFIG_UART_PDL_INFINEON_CAT1=y

CONFIG_SPI_PDL_INFINEON_CAT1=y

# SPI Master Configuration
CONFIG_SPI=y
CONFIG_PINCTRL=y
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y
CONFIG_SPI_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Optional:
CONFIG_IFX_CAT1_SPI_DMA=y
CONFIG_IFX_CAT1_SPI_DMA_TX_AUTO_TRIGGER=y

CONFIG_DMA=y
CONFIG_DMA_LOG_LEVEL_ERR=y

# Increase stack size for debug logging
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
